name: Paper round

# Reads the freely published ETF-flow and treasury pages once a day and commits the numbers to
# data/flows.json, which the app reads from its own origin. See tools/paper-round.ts for why this
# exists (short version: the CORS rule only applies inside browsers, so a server-side robot can read
# what the page cannot).

on:
  schedule:
    # 21:40 UTC — Farside publishes in the US evening, so this lands after the day's rows are up.
    - cron: "40 21 * * 1-6"
    # 08:10 UTC — a retry, not a second reading. The evening run is the one that matters; this one
    # exists so a night when the site was down or slow heals itself by breakfast instead of leaving
    # the pillar stale until the following evening. It is a no-op when the evening run succeeded,
    # because the commit step only commits an actual change.
    - cron: "10 8 * * 2-6"
  workflow_dispatch:

# The job commits to the repo, so it needs write access. Nothing else.
permissions:
  contents: write

# ⚠️ `cancel-in-progress: true`, and it is NOT the usual reason (saving runner minutes). A stuck
# run must never block the next one. On 2026-08-06 three runs sat unstarted in GitHub's queue for
# 20+ minutes; with `false`, the newest simply waited behind them — so the nightly scheduled read
# would have been blocked too, by a run that was never going to happen. For a daily snapshot the
# NEWEST read is the one worth having and an older queued one is worth nothing, so superseding is
# strictly correct here. The commit step is idempotent, so a cancelled run leaves nothing behind.
concurrency:
  group: paper-round
  cancel-in-progress: true

jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and update the snapshot
        run: node tools/paper-round.ts

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/flows.json; then
            echo "No change to data/flows.json"
            exit 0
          fi
          git config user.name "market-watch-bot"
          git config user.email "market-watch-bot@users.noreply.github.com"
          git add data/flows.json
          git commit -m "Paper round: flow snapshot $(date -u +%Y-%m-%d)"
          git push
