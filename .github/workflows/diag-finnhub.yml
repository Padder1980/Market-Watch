name: Diagnose Finnhub analyst endpoint (temporary)

# One-off: confirms why the discover-shares scan's analyst pillar came back null for all 52
# companies on 2026-08-08. Deleted right after use — see tools/diag-finnhub.ts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Finnhub's analyst endpoints directly
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node tools/diag-finnhub.ts
